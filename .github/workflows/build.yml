name: Build and test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: |
          mkdir -p ci-out
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee ci-out/build.log

      - name: Collect jar
        id: jar
        if: steps.build.outcome == 'success'
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -E -- '-(sources|slim|dev)\.jar$' | head -1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          cp "$JAR" ci-out/
          unzip -l "$JAR" > ci-out/jar-contents.txt
          unzip -p "$JAR" META-INF/MANIFEST.MF > ci-out/MANIFEST.MF || true
          unzip -p "$JAR" smoothsailing.refmap.json > ci-out/refmap.json || echo "NO REFMAP IN JAR" > ci-out/refmap.json

      - name: Smoke test (Eureka 1.6.3, the pack's version)
        id: smoke163
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bash ci/smoke-test.sh 1.6.3 "${{ steps.jar.outputs.path }}" ci-out/smoke-1.6.3

      - name: Smoke test (Eureka 1.6.4, latest)
        id: smoke164
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bash ci/smoke-test.sh 1.6.4 "${{ steps.jar.outputs.path }}" ci-out/smoke-1.6.4

      - name: Summary
        if: always()
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "build=${{ steps.build.outcome }}"
            echo "smoke_1_6_3=${{ steps.smoke163.outcome }}"
            echo "smoke_1_6_4=${{ steps.smoke164.outcome }}"
          } | tee ci-out/summary.txt
          if [ -f ci-out/build.log ]; then tail -n 150 ci-out/build.log > ci-out/build-tail.log; fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoothsailing-${{ github.sha }}
          path: ci-out/
          retention-days: 30

      # Publish results to a branch as well, so they can be read with plain git.
      - name: Publish results branch
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ci-out
          find . -name '*.log' -size +5M -exec sh -c 'tail -c 5000000 "$1" > "$1.tail" && mv "$1.tail" "$1"' _ {} \;
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "CI results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Fail if tests failed
        if: steps.smoke163.outcome != 'success'
        run: exit 1

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.smoke163.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
